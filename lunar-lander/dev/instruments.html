<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Cockpit kit & instruments harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #scene { width: 100vw; height: 100vh; display: block; }
  #info { position: fixed; left: 8px; top: 6px; color: #9f9; font: 12px monospace; white-space: pre; pointer-events: none; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="info"></div>
<!--
  INSTRUMENTS harness. URL parameters:
    view   = all | dsky | fdai | lm | tapes | xptr | timers | cw | switches | cb | controls | csm | ems |
             gauges | cards | <x,y,dist> (metres on the test wall)
    t      = fake-vessel time (s) to start at (deterministic pose/values); anim=0 freezes it
    post=0 = skip post-processing (plain renderer)
    sun=0  = no sun patch (flood light only); flood=<intensity>; integral=<0..1>; exposure=<EV override>
    yaw, pitch = extra camera look offsets (deg); dist = camera distance override (m); fov
-->
<script type="module" src="./instruments.js"></script>
</body>
</html>
