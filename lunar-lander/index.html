<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Apollo Lunar Landing</title>
    <meta name="description" content="Fly the Apollo Command/Service Module and Lunar Module and land on the Moon." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%23bdb8ad%22/%3E%3Ccircle cx=%2211%22 cy=%2212%22 r=%223%22 fill=%22%23928d82%22/%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%224%22 fill=%22%23928d82%22/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #000;
        --fg: #e8e6e1;
        --muted: #8a8f96;
        --accent: #ffb347;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
      body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
      #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui * { pointer-events: auto; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; letter-spacing: 0.3em; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="boot">INITIALIZING GUIDANCE COMPUTER…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
