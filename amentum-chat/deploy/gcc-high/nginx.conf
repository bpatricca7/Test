# Example reverse proxy in front of Amentum AI (TLS termination on the Amentum network).
# Authentication is expected upstream (Entra Application Proxy / ADFS / oauth2-proxy) and must
# set X-MS-CLIENT-PRINCIPAL-NAME; this proxy strips any client-supplied copy first.

upstream amentum_ai {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.amentum.internal;

    ssl_certificate     /etc/nginx/certs/ai.amentum.internal.crt;
    ssl_certificate_key /etc/nginx/certs/ai.amentum.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 110m;          # MAX_UPLOAD_MB + multipart overhead

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://amentum_ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Identity: never trust the header from the browser. Replace with the authenticated
        # user from your auth layer (e.g. $upstream_http_x_auth_request_email for oauth2-proxy).
        proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME $remote_user;
    }

    # Streaming chat responses (Server-Sent Events): no buffering, long timeouts.
    location /api/chat {
        proxy_pass http://amentum_ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME $remote_user;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;
    }
}
