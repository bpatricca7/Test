:root {
  --sw-pink: #FF5FA2; --sw-pink-soft: #FFD1E6; --sw-lav: #9C7BFF; --sw-lav-soft: #E6DDFF;
  --sw-mint: #3FD8B0; --sw-sun: #FFC94D; --sw-sky: #6CC6FF; --sw-ink: #3A1F4D;

  --sw-bounce: cubic-bezier(.34, 1.56, .64, 1);
}
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #BDE6FF;
  font-family: var(--sw-font); color: var(--sw-ink);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
#app { position: fixed; inset: 0; overflow: hidden; background: #BDE6FF; }
.sw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.sw-app * { box-sizing: border-box; }
.sw-app button, .sw-app input { font-family: var(--sw-font); }

/* layers */
.sw-ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-family: var(--sw-font); }
.sw-layer { position: absolute; inset: 0; pointer-events: none; }
.sw-layer > * { pointer-events: auto; }

/* chunky sticker buttons */
.sw-btn {
  --c: var(--sw-pink); --fg: #fff;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 8px 22px; border: 4px solid #fff; border-radius: 999px;
  background: var(--c); color: var(--fg); font-size: 20px; font-weight: 600; letter-spacing: .2px;
  box-shadow: 0 5px 0 rgba(58,31,77,.16), 0 10px 22px var(--sw-shadow), inset 0 -5px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.28);
  cursor: pointer; pointer-events: auto; white-space: nowrap; text-shadow: 0 2px 0 rgba(58,31,77,.15);
  transition: transform .18s var(--sw-bounce), box-shadow .18s, filter .18s;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.sw-btn:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.04); }
.sw-btn:active, .sw-btn.sw-pressed { transform: translateY(3px) scale(.94); box-shadow: 0 2px 0 rgba(58,31,77,.16), 0 4px 10px var(--sw-shadow), inset 0 -3px 0 rgba(0,0,0,.08); }
.sw-btn:focus-visible { outline: 4px solid var(--sw-sun); outline-offset: 3px; }
.sw-btn svg { width: 1.35em; height: 1.35em; flex: none; filter: drop-shadow(0 2px 0 rgba(58,31,77,.15)); }
.sw-btn[disabled] { filter: grayscale(.6) opacity(.6); cursor: default; }
.sw-btn--pink { --c: var(--sw-pink); }
.sw-btn--lav { --c: var(--sw-lav); }
.sw-btn--mint { --c: var(--sw-mint); }
.sw-btn--sky { --c: var(--sw-sky); }
.sw-btn--sun { --c: var(--sw-sun); --fg: var(--sw-ink); text-shadow: none; }
.sw-btn--white { --c: #fff; --fg: var(--sw-ink); border-color: var(--sw-pink-soft); text-shadow: none; }
.sw-btn--white svg { color: var(--sw-pink); }
.sw-btn--big { min-height: 68px; font-size: 26px; padding: 10px 34px; }
.sw-btn--small { min-height: 42px; font-size: 16px; padding: 4px 14px; border-width: 3px; }
.sw-btn--icon { width: 52px; min-height: 52px; padding: 0; }

/* panels */
.sw-panel-wrap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: calc(12px + var(--sw-safe-t)) calc(12px + var(--sw-safe-r)) calc(12px + var(--sw-safe-b)) calc(12px + var(--sw-safe-l)); }
.sw-panel-wrap.sw-open { display: flex; }
.sw-backdrop { position: absolute; inset: 0; background: rgba(58,31,77,.32); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: sw-fade .2s ease-out; }
.sw-card {

  background: var(--sw-cream); border: 5px solid #fff; border-radius: 30px;
  box-shadow: 0 8px 0 rgba(58,31,77,.12), 0 22px 60px rgba(58,31,77,.35);
  animation: sw-pop .32s var(--sw-bounce);
}
.sw-card-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 6px 24px; }
.sw-card-title { flex: 1; margin: 0; font-size: 30px; font-weight: 700; color: var(--sw-pink); text-shadow: 0 3px 0 #fff, 0 4px 0 rgba(58,31,77,.08); display: flex; align-items: center; gap: 10px; }
.sw-card-title svg { width: 34px; height: 34px; }
.sw-card-body { padding: 8px 22px 22px; overflow: auto; -webkit-overflow-scrolling: touch; }
.sw-close { --c: var(--sw-lav-soft); --fg: var(--sw-lav); width: 50px; min-height: 50px; padding: 0; text-shadow: none; }
.sw-full { position: absolute; inset: 0; animation: sw-fade .25s ease-out; }

/* toasts */
.sw-toasts { position: absolute; top: calc(14px + var(--sw-safe-t)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none !important; z-index: 40; width: max-content; max-width: 92vw; }
.sw-toast {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px;
  background: #fff; color: var(--sw-ink); border: 4px solid var(--sw-pink-soft); font-size: 19px; font-weight: 600;
  box-shadow: 0 6px 18px var(--sw-shadow); animation: sw-pop .35s var(--sw-bounce); pointer-events: none;
}
.sw-toast svg { width: 26px; height: 26px; color: var(--sw-pink); flex: none; }
.sw-toast--big { font-size: 24px; padding: 14px 26px; border-color: var(--sw-sun); background: linear-gradient(#FFFDF2, #FFF1C9); }
.sw-toast--big svg { width: 34px; height: 34px; color: #F5A300; }
.sw-toast.sw-leave { animation: sw-leave .3s ease-in forwards; }

/* hint bubble */
.sw-hint {
  position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%);
  padding: 7px 16px; border-radius: 999px; background: rgba(255,255,255,.94); color: var(--sw-ink);
  border: 3px solid var(--sw-mint); font-size: 17px; font-weight: 600; box-shadow: 0 4px 12px var(--sw-shadow);
  pointer-events: none !important; white-space: nowrap; animation: sw-pop .25s var(--sw-bounce);
}
.sw-hint[hidden] { display: none; }

/* loading & fades */
.sw-loading {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(circle at 50% 35%, #FFF1F8 0%, #FFD1E6 45%, #C9B8FF 100%); z-index: 60;
}
.sw-loading.sw-open { display: flex; }
.sw-loading-text { font-size: 30px; font-weight: 700; color: var(--sw-ink); text-shadow: 0 3px 0 #fff; text-align: center; padding: 0 20px; }
.sw-loading-bar { width: min(420px, 78vw); height: 28px; border-radius: 999px; background: #fff; border: 4px solid #fff; box-shadow: 0 6px 18px var(--sw-shadow); overflow: hidden; }
.sw-loading-fill { height: 100%; width: 0%; border-radius: 999px; background: repeating-linear-gradient(-45deg, var(--sw-pink) 0 14px, #FF7FB6 14px 28px); transition: width .25s ease-out; }
.sw-loading-cubes { display: flex; gap: 12px; }
.sw-loading-cubes span { width: 34px; height: 34px; border-radius: 9px; border: 4px solid #fff; box-shadow: 0 5px 12px var(--sw-shadow); animation: sw-hop 1s var(--sw-bounce) infinite; }
.sw-loading-cubes span:nth-child(1) { background: var(--sw-pink); }
.sw-loading-cubes span:nth-child(2) { background: var(--sw-sun); animation-delay: .12s; }
.sw-loading-cubes span:nth-child(3) { background: var(--sw-mint); animation-delay: .24s; }
.sw-loading-cubes span:nth-child(4) { background: var(--sw-sky); animation-delay: .36s; }
.sw-loading-cubes span:nth-child(5) { background: var(--sw-lav); animation-delay: .48s; }
.sw-fader { position: absolute; inset: 0; background: #1D1647; opacity: 0; pointer-events: none !important; transition: opacity .8s ease; z-index: 50; display: flex; align-items: center; justify-content: center; }
.sw-fader.sw-on { opacity: .92; pointer-events: auto !important; }
.sw-fader-text { font-size: 64px; font-weight: 700; color: #FFF6D8; text-shadow: 0 0 24px rgba(255,230,150,.7); animation: sw-float 2s ease-in-out infinite; }
.sw-star { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #FFF6D8; box-shadow: 0 0 10px #FFF6D8; animation: sw-twinkle 1.6s ease-in-out infinite; }

/* dialogs */
.sw-dialog-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 70; padding: 16px; }
.sw-dialog { width: min(460px, 100%); background: #fff; border: 5px solid var(--sw-pink-soft); border-radius: 28px; padding: 22px; text-align: center; box-shadow: 0 22px 60px rgba(58,31,77,.4); animation: sw-pop .3s var(--sw-bounce); }
.sw-dialog h3 { margin: 0 0 8px; font-size: 28px; color: var(--sw-pink); }
.sw-dialog p { margin: 0 0 18px; font-size: 19px; }
.sw-dialog-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.sw-input { width: 100%; font-size: 22px; font-weight: 600; padding: 12px 16px; border-radius: 18px; border: 4px solid var(--sw-lav-soft); background: var(--sw-cream); color: var(--sw-ink); outline: none; -webkit-user-select: text; user-select: text; }
.sw-input:focus { border-color: var(--sw-lav); }
.sw-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0 16px; }
.sw-chip { border: 3px solid var(--sw-lav-soft); background: #fff; color: var(--sw-lav); border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.sw-chip:active { transform: scale(.94); }

@keyframes sw-pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes sw-leave { to { transform: translateY(-16px) scale(.8); opacity: 0; } }
@keyframes sw-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sw-hop { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-18px) rotate(8deg); } }
@keyframes sw-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes sw-twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }
@keyframes sw-wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes sw-drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

@media (prefers-reduced-motion: reduce) {
  .sw-app *, .sw-app *::before, .sw-app *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 600px) {
  .sw-btn { font-size: 18px; min-height: 48px; padding: 6px 18px; }
  .sw-btn--big { font-size: 22px; min-height: 60px; }
  .sw-card-title { font-size: 25px; }
  .sw-card-body { padding: 6px 14px 16px; }
  .sw-toast { font-size: 16px; }
  .sw-toast--big { font-size: 19px; }
}

.sw-hud { position: absolute; inset: 0; pointer-events: none !important; display: none; }

.sw-hud * { pointer-events: auto; }
.sw-hud .sw-passive, .sw-hud .sw-passive * { pointer-events: none; }

.sw-hud-tl { position: absolute; top: calc(12px + var(--sw-safe-t)); left: calc(12px + var(--sw-safe-l)); display: flex; gap: 8px; align-items: center; max-width: 52vw; }
.sw-pill { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 10px; border-radius: 999px; background: rgba(255,255,255,.92); border: 4px solid #fff; box-shadow: 0 5px 14px var(--sw-shadow); font-size: 19px; font-weight: 600; color: var(--sw-ink); white-space: nowrap; min-width: 0; }
.sw-pill svg { width: 28px; height: 28px; flex: none; }
.sw-pill .sw-name { overflow: hidden; text-overflow: ellipsis; }
.sw-time svg { color: #FFB300; }
.sw-time.sw-night svg { color: var(--sw-lav); }
.sw-gems svg { color: var(--sw-mint); }

.sw-hud-tr { position: absolute; top: calc(10px + var(--sw-safe-t)); right: calc(12px + var(--sw-safe-r)); display: flex; gap: 10px; }
.sw-round { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--sw-font); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.sw-round-face { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--c, var(--sw-pink)); color: #fff; border: 4px solid #fff; box-shadow: 0 5px 0 rgba(58,31,77,.14), 0 8px 18px var(--sw-shadow), inset 0 -5px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.3); transition: transform .18s var(--sw-bounce); }
.sw-round-face svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 0 rgba(58,31,77,.15)); }
.sw-round-label { position: relative; z-index: 1; font-size: 13px; font-weight: 700; color: var(--sw-ink); background: rgba(255,255,255,.92); padding: 1px 8px; border-radius: 999px; box-shadow: 0 2px 6px var(--sw-shadow); }
.sw-round:hover .sw-round-face { transform: scale(1.06); }
.sw-round:active .sw-round-face { transform: scale(.9); }
.sw-round.sw-active .sw-round-face { box-shadow: 0 0 0 5px var(--sw-sun), 0 8px 22px var(--sw-shadow), inset 0 -5px 0 rgba(0,0,0,.08); transform: scale(1.1); }
.sw-round.sw-active .sw-round-label { background: var(--sw-sun); }
.sw-round--big .sw-round-face { width: 70px; height: 70px; }
.sw-round--big .sw-round-face svg { width: 38px; height: 38px; }
.sw-round[hidden] { display: none; }

.sw-hud-right { position: absolute; right: calc(14px + var(--sw-safe-r)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.sw-hud-right .sw-sep { height: 4px; width: 36px; border-radius: 4px; background: rgba(255,255,255,.7); margin: 2px 0; }

.sw-hud-bottom { position: absolute; left: 50%; bottom: calc(12px + var(--sw-safe-b)); transform: translateX(-50%); display: flex; align-items: flex-end; gap: 12px; }
.sw-hotbar { display: flex; gap: 6px; padding: 7px; border-radius: 26px; background: rgba(255,255,255,.55); border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 22px var(--sw-shadow); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.sw-slot { position: relative; width: 60px; height: 60px; border-radius: 18px; background: var(--sw-cream); border: 3px solid #fff; box-shadow: inset 0 -4px 0 rgba(58,31,77,.08); display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .18s var(--sw-bounce), box-shadow .18s; touch-action: manipulation; }
.sw-slot img { width: 46px; height: 46px; image-rendering: auto; pointer-events: none; }
.sw-slot .sw-num { position: absolute; top: 2px; left: 6px; font-size: 12px; font-weight: 700; color: rgba(58,31,77,.45); pointer-events: none; }
.sw-slot .sw-swatch { position: absolute; bottom: 4px; right: 4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; pointer-events: none; }
.sw-slot.sw-sel { transform: translateY(-8px) scale(1.12); background: #fff; border-color: var(--sw-pink); box-shadow: 0 0 0 4px #fff, 0 0 18px 6px rgba(255,95,162,.55), 0 8px 16px var(--sw-shadow); }
.sw-slot:active { transform: scale(.92); }

.sw-crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none !important; display: none; }
.sw-crosshair::before, .sw-crosshair::after { content: ''; position: absolute; background: #fff; border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(58,31,77,.35); }
.sw-crosshair::before { left: 9px; top: 2px; width: 4px; height: 18px; }
.sw-crosshair::after { top: 9px; left: 2px; height: 4px; width: 18px; }
.sw-crosshair.sw-show { display: block; }

.sw-tab { flex: none; border: 3px solid #fff; background: var(--sw-lav-soft); color: var(--sw-ink); border-radius: 999px; padding: 8px 16px; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 8px var(--sw-shadow); transition: transform .15s var(--sw-bounce); font-family: var(--sw-font); }
.sw-tab.sw-sel { background: var(--sw-pink); color: #fff; transform: scale(1.06); }

.sw-item:hover { transform: translateY(-3px) scale(1.03); border-color: var(--sw-pink); }

.sw-swatches button:active { transform: scale(.85); }

  .sw-bag-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }

.sw-title { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #6EC3FF 0%, #A9DEFF 38%, #FFE0F0 78%, #FFD1E6 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(20px + var(--sw-safe-t)) 16px calc(20px + var(--sw-safe-b)); }
.sw-cloud { position: absolute; width: 180px; height: 56px; border-radius: 40px; background: #fff; opacity: .92; animation: sw-drift linear infinite; box-shadow: 0 10px 0 rgba(255,255,255,.4); }
.sw-cloud::before, .sw-cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.sw-cloud::before { width: 80px; height: 80px; left: 26px; top: -40px; }
.sw-cloud::after { width: 64px; height: 64px; left: 88px; top: -28px; }
.sw-hills { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none; }
.sw-hills svg { width: 100%; height: 100%; display: block; }
.sw-logo { position: relative; z-index: 2; text-align: center; line-height: .92; margin: 0; font-weight: 700; font-size: clamp(56px, 12vw, 128px); letter-spacing: 2px; animation: sw-pop .6s var(--sw-bounce); }
.sw-logo .sw-word { display: block; white-space: nowrap; }
.sw-logo .sw-l { display: inline-block; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(58,31,77,.16); animation: sw-float 3s ease-in-out infinite; }
.sw-logo-sparkle { position: absolute; color: var(--sw-sun); width: 44px; height: 44px; animation: sw-twinkle 1.8s ease-in-out infinite; filter: drop-shadow(0 3px 0 #fff); }
.sw-tagline { position: relative; z-index: 2; font-size: clamp(18px, 3vw, 26px); font-weight: 600; color: var(--sw-ink); background: rgba(255,255,255,.85); padding: 6px 20px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 12px var(--sw-shadow); }
.sw-title-buttons { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: stretch; gap: 12px; width: min(360px, 88vw); margin-top: 6px; }
.sw-title-small { position: relative; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sw-floaty { position: absolute; width: 64px; height: 64px; animation: sw-float 3.4s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(58,31,77,.2)); z-index: 1; }

.sw-field-label { font-size: 19px; font-weight: 700; color: var(--sw-lav); margin: 10px 0 8px; display: flex; align-items: center; gap: 8px; }
.sw-field-label svg { width: 22px; height: 22px; }
.sw-biomes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw-biome { position: relative; border-radius: 22px; border: 4px solid #fff; padding: 12px 10px 12px; cursor: pointer; text-align: center; box-shadow: 0 5px 14px var(--sw-shadow); transition: transform .18s var(--sw-bounce), box-shadow .18s; font-family: var(--sw-font); color: var(--sw-ink); }
.sw-biome img { width: 70px; height: 70px; display: block; margin: 0 auto 4px; filter: drop-shadow(0 5px 6px rgba(58,31,77,.2)); }
.sw-biome-name { font-size: 18px; font-weight: 700; }
.sw-biome-desc { font-size: 13px; opacity: .8; line-height: 1.15; margin-top: 2px; }
.sw-biome.sw-sel { border-color: var(--sw-pink); transform: scale(1.04); box-shadow: 0 0 0 4px #fff, 0 8px 22px rgba(255,95,162,.45); }
.sw-biome .sw-check { position: absolute; top: -10px; right: -10px; width: 34px; height: 34px; border-radius: 50%; background: var(--sw-pink); color: #fff; border: 3px solid #fff; display: none; place-items: center; }
.sw-biome.sw-sel .sw-check { display: grid; }
.sw-biome .sw-check svg { width: 20px; height: 20px; }
.sw-sizes { display: flex; gap: 10px; flex-wrap: wrap; }
.sw-toggle.sw-sel { --c: var(--sw-lav); --fg: #fff; border-color: #fff; }
.sw-create-row { display: flex; justify-content: center; margin-top: 18px; }

.sw-worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.sw-world { background: #fff; border-radius: 22px; border: 4px solid var(--sw-pink-soft); overflow: hidden; box-shadow: 0 5px 14px var(--sw-shadow); display: flex; flex-direction: column; }
.sw-world-thumb { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #BDF5C6, #9FD8FF); display: grid; place-items: center; overflow: hidden; }
.sw-world-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sw-world-thumb svg { width: 48px; height: 48px; color: #fff; }
.sw-world-info { padding: 8px 12px 4px; }
.sw-world-name { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-world-meta { font-size: 14px; color: var(--sw-lav); font-weight: 600; }
.sw-world-actions { display: flex; gap: 6px; padding: 6px 10px 12px; align-items: center; }
.sw-world-actions .sw-btn--pink { flex: 1; }
.sw-empty { text-align: center; padding: 24px; font-size: 20px; color: var(--sw-lav); display: flex; flex-direction: column; align-items: center; gap: 14px; }

.sw-pause { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(380px, 100%); margin: 0 auto; }
.sw-pause-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
